name: Build Windows exe

# Every push builds and tests CalendarVisualizer.exe.
# Pushes to the default branch also publish a GitHub Release "v<version>"
# (version from calviz/__init__.py) unless that release already exists.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm --clean calviz.spec

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CalendarVisualizer.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
          Write-Host "selftest OK"

      - name: Upload exe (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CalendarVisualizer-windows
          path: |
            dist/CalendarVisualizer.exe
            AI_SYNTAX_GUIDE.md
            examples/sample.md

      - name: Check whether this version needs a release
        id: version
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path calviz/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          if (-not $m) { throw "__version__ not found in calviz/__init__.py" }
          $tag = "v" + $m.Matches[0].Groups[1].Value
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists - skipping (raise __version__ to publish a new one)."
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Will publish $tag"
            "publish=true" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Calendar Visualizer ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Download `CalendarVisualizer.exe` below and double-click it.** No installation needed.

            Windows may show a blue "Windows protected your PC" screen the first time, because the program is not code-signed.
            Click **More info → Run anyway**.

            - `AI_SYNTAX_GUIDE.md`: give this file to your AI agent so it can write calendar files for you.
            - `sample.md`: an example calendar file you can import.

            **To remove it completely:** click Help → *Remove all my data and quit…*, then delete `CalendarVisualizer.exe`. It has no installer and makes no registry entries.
          files: |
            dist/CalendarVisualizer.exe
            AI_SYNTAX_GUIDE.md
            examples/sample.md
