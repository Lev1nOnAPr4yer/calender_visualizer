name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm --clean calviz.spec

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CalendarVisualizer.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
          Write-Host "selftest OK"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: CalendarVisualizer-windows
          path: |
            dist/CalendarVisualizer.exe
            AI_SYNTAX_GUIDE.md
            examples/sample.md

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CalendarVisualizer.exe
            AI_SYNTAX_GUIDE.md
